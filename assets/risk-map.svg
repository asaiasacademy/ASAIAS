<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Карта рисков ИИ</title>
  <desc id="desc">Матрица рисков ИИ по данным, модели, автономности, человеку, институции и последствиям.</desc>
  <rect width="960" height="620" fill="#fbfdfc"/>
  <g stroke="#d7e1de" stroke-width="1">
    <path d="M160 80V540M300 80V540M440 80V540M580 80V540M720 80V540M860 80V540"/>
    <path d="M100 150H860M100 220H860M100 290H860M100 360H860M100 430H860M100 500H860"/>
  </g>
  <g font-family="Segoe UI, Arial">
    <text x="480" y="54" text-anchor="middle" font-size="28" font-weight="800" fill="#163e5a">Риск-карта ИИ-системы</text>
    <text x="480" y="584" text-anchor="middle" font-size="15" fill="#58676a">низкий риск → средний риск → высокий риск</text>
    <g font-size="15" font-weight="800" fill="#101719">
      <text x="92" y="124" text-anchor="end">Данные</text>
      <text x="92" y="194" text-anchor="end">Модель</text>
      <text x="92" y="264" text-anchor="end">Автономность</text>
      <text x="92" y="334" text-anchor="end">Человек</text>
      <text x="92" y="404" text-anchor="end">Институция</text>
      <text x="92" y="474" text-anchor="end">Последствия</text>
    </g>
    <g opacity=".95">
      <circle cx="230" cy="120" r="24" fill="#3c7456"/>
      <circle cx="370" cy="190" r="30" fill="#b27633"/>
      <circle cx="510" cy="260" r="38" fill="#8d5341"/>
      <circle cx="650" cy="330" r="34" fill="#b27633"/>
      <circle cx="510" cy="400" r="28" fill="#3c7456"/>
      <circle cx="790" cy="470" r="44" fill="#8d5341"/>
      <path d="M230 120L370 190L510 260L650 330L510 400L790 470" fill="none" stroke="#1d5d86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-size="13" font-weight="800" fill="#ffffff">
      <text x="230" y="125" text-anchor="middle">2</text>
      <text x="370" y="195" text-anchor="middle">3</text>
      <text x="510" y="265" text-anchor="middle">4</text>
      <text x="650" y="335" text-anchor="middle">3</text>
      <text x="510" y="405" text-anchor="middle">2</text>
      <text x="790" y="475" text-anchor="middle">5</text>
    </g>
  </g>
</svg>

    <path d="M194 110C207 110 219 114 228 122L216 139C210 134 203 131 195 131C187 131 181 134 177 138C173 143 171 149 171 157C171 166 173 172 178 177C182 181 188 184 197 184C205 184 213 181 219 176L230 193C220 201 208 205 194 205C179 205 168 201 159 192C150 183 145 171 145 157C145 142 150 131 159 122C168 114 180 110 194 110Z" fill="#087f82"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" fill="#101719">
    <text x="410" y="118" font-size="22" font-weight="700" fill="#3c7456">PUBLIC PILOT BASELINE</text>
    <text x="410" y="178" font-size="64" font-weight="900">ASAIAS</text>
    <text x="410" y="226" font-size="30" font-weight="800" fill="#163e5a">Academy of Strategic AI and Autonomous Systems Management</text>
    <text x="410" y="270" font-size="23" font-weight="600" fill="#334246">AI governance · agent architectures · risk maps · review workflows</text>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ASAIAS GitHub academy showcase</title>
  <desc id="desc">A sober academic GitHub banner for the Academy of Strategic Artificial Intelligence and Autonomous Systems Management.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfc"/>
      <stop offset="0.58" stop-color="#eef5f3"/>
      <stop offset="1" stop-color="#e7efe9"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163e5a"/>
      <stop offset="1" stop-color="#087f82"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#163e5a" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#paper)"/>
  <path d="M0 438C136 408 224 432 338 398C492 352 584 248 756 254C944 262 1012 378 1200 328V520H0Z" fill="#dcebe6"/>
